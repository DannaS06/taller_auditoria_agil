name: CI Quality Gate

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Puerta 1 - Análisis Estático y Estilo (Flake8)
      run: |
        # Falla el pipeline si hay errores de sintaxis o variables no usadas
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests --count --max-line-length=100 --statistics

    - name: Puerta 2 - Ejecución de Pruebas Unitarias y Cobertura
      run: |
        pytest --cov=src --cov-fail-under=80 tests/